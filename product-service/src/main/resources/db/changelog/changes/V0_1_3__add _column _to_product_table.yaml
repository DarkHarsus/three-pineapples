databaseChangeLog:
  - changeSet:
      id: 3
      author: darkharsus
      changes:
        - createTable:
            tableName: product_images
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_images_product_id
                    references: products(id)
                    deleteCascade: true
              - column:
                  name: image_url
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_main
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false