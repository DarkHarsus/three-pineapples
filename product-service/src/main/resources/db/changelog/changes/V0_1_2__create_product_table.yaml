databaseChangeLog:
  - changeSet:
      id: 2
      author: darkharsus
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: quantity_in_stock
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal(7, 2)
                  constraints:
                    nullable: false
              - column:
                  name: weight
                  type: decimal(4, 2)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
                  constraints:
                    nullable: false